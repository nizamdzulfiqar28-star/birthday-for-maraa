    <script>
      (function() {
        var audio = document.getElementById('bgMusic');
        function playAudioInstantly() {
          if (audio && audio.paused) {
            var playPromise = audio.play();
            if (playPromise !== undefined) {
              playPromise.catch(function() {
                // browser requires user interaction first
              });
            }
          }
        }
        // Try immediately upon script evaluation
        playAudioInstantly();
        document.addEventListener('DOMContentLoaded', playAudioInstantly);
        window.addEventListener('load', playAudioInstantly);

        // Immediate zero-delay trigger on initial user interaction
        var events = ['click', 'touchstart', 'pointerdown', 'keydown'];
        var triggered = false;
        function onAnyInteraction() {
          if (triggered) return;
          triggered = true;
          playAudioInstantly();
        }
        events.forEach(function(e) {
          window.addEventListener(e, onAnyInteraction, { once: true, passive: true });
        });
      })();
    </script>
